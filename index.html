    <!-- Phase 1: Hardware & Device Capability Detection Engine -->
    <script>
      (function() {
        var doc = document.documentElement;
        var nav = navigator || {};
        var conn = nav.connection || nav.mozConnection || nav.webkitConnection;
        var ua = nav.userAgent || '';
        
        var isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var isReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        var isLegacyUA = /Opera Mini|IEMobile|Android (?:[1-6]\.)/i.test(ua);
        var isLowConcurrency = typeof nav.hardwareConcurrency === 'number' && nav.hardwareConcurrency <= 2;
        var isLowMemory = typeof nav.deviceMemory === 'number' && nav.deviceMemory <= 3;
        var isDataSaver = conn && (conn.saveData === true || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g');
        
        var isLowEnd = isLegacyUA || isLowConcurrency || isLowMemory || isDataSaver;
        var isMidTier = !isLowEnd && isTouch;
        
        if (isLowEnd) {
          doc.classList.add('low-end');
        } else if (isMidTier) {
          doc.classList.add('mid-tier');
        }
        
        if (isTouch) {
          doc.classList.add('touch-device');
        }
        if (isReducedMotion) {
          doc.classList.add('reduced-motion');
        }
        
        window.__deviceTier = {
          tier: isLowEnd ? 'low-end' : (isMidTier ? 'mid-tier' : 'high-end'),
          isLowEnd: isLowEnd,
          isMidTier: isMidTier,
          isTouch: isTouch,
          isReducedMotion: isReducedMotion
        };

        // 2. Battery-Aware Power Throttling
        if (typeof nav.getBattery === 'function') {
          nav.getBattery().then(function(battery) {
            function updateBatteryThrottling() {
              var isBatteryLow = !battery.charging && battery.level <= 0.20;
              if (isBatteryLow) {
                doc.classList.add('low-end');
                doc.classList.add('battery-saver');
                if (window.__deviceTier) window.__deviceTier.isBatteryLow = true;
              } else if (!isLowEnd) {
                doc.classList.remove('battery-saver');
                if (!isLowConcurrency && !isLowMemory && !isLegacyUA && !isDataSaver) {
                  doc.classList.remove('low-end');
                  if (isMidTier) doc.classList.add('mid-tier');
                }
                if (window.__deviceTier) window.__deviceTier.isBatteryLow = false;
              }
            }
            updateBatteryThrottling();
            battery.addEventListener('levelchange', updateBatteryThrottling);
            battery.addEventListener('chargingchange', updateBatteryThrottling);
          }).catch(function() {});
        }

        // 3. Network-Aware Bandwidth Throttling
        if (conn && typeof conn.addEventListener === 'function') {
          function updateNetworkThrottling() {
            var isSlowConn = conn.saveData === true || conn.effectiveType === 'slow-2g' || conn.effectiveType === '2g';
            if (isSlowConn) {
              doc.classList.add('low-end');
              doc.classList.add('data-saver');
              if (window.__deviceTier) window.__deviceTier.isSlowConn = true;
            } else if (!isLowConcurrency && !isLowMemory && !isLegacyUA) {
              doc.classList.remove('data-saver');
              if (!doc.classList.contains('battery-saver')) {
                doc.classList.remove('low-end');
                if (isMidTier) doc.classList.add('mid-tier');
              }
              if (window.__deviceTier) window.__deviceTier.isSlowConn = false;
            }
          }
          conn.addEventListener('change', updateNetworkThrottling);
        }
      })();
    </script>
